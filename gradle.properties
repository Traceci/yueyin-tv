org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Windows 上项目路径含中文时 AGP 会中止构建；本项目路径含「悦音」，故放开该检查
android.overridePathCheck=true

# R8 full mode：相比兼容模式更激进地移除未引用代码/字段，缩小包体、减少运行时类加载开销。
# 注意：full mode 下 R8 不再保守保留仅被反射调用的成员，WebView JS 桥的 @JavascriptInterface 方法
# 必须靠 proguard-rules.pro 里的显式 keep 规则兜底（否则音源运行时整体失效）。
android.enableR8.fullMode=true
